<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario del desarrollador · Trabajo 1</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- MENÚ: el mismo en todas las páginas -->
  <nav id="menu">
    <span class="menu__marca">Diario del desarrollador</span>
    <ul class="menu__lista">
      <li><a href="index.html" class="menu__enlace">HOME</a></li>
      <li><a href="trabajo1.html" class="menu__enlace">TRABAJO 1</a></li>
    </ul>
  </nav>

  <h1>Trabajo 1</h1>
  <p>Aquí irá el contenido del primer trabajo.</p>
  <h2>Añadir un juego</h2>
  
  <form id="formJuego">
    <input type="text"   id="inNombre"     placeholder="Nombre" required>
    <input type="text"   id="inCompania"   placeholder="Compañía" required>
    <input type="text"   id="inPlataforma" placeholder="Plataforma" required>
    <input type="number" id="inValoracion" placeholder="Valoración" step="0.1" min="0" max="10" required>
    <input type="number" id="inPrecio"     placeholder="Precio (€)" step="0.01" min="0" required>
    <button type="submit">Añadir</button>
  </form>

  <h2>Mis videojuegos</h2>
  <table id="tablaJuegos">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Compañía</th>
        <th>Plataforma</th>
        <th>Valoración</th>
        <th>Precio</th>
      </tr>
    </thead>
    <tbody id="cuerpoJuegos"></tbody>
  </table>
  <script src="juegos.js"></script>
</body>
</html>
